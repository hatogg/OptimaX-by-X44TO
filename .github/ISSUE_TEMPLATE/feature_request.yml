name: "💡 Ідея · Feature request"
description: "Нова функція чи покращення · A new feature or improvement"
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: "Яку проблему це вирішить · What problem it solves"
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: "Як це могло б працювати · How it could work"
  - type: textarea
    id: alt
    attributes:
      label: "Як ви робите це зараз · How you do it now"
