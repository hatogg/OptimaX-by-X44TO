# Сайт програми на GitHub Pages: https://hatogg.github.io/OptimaX-by-X44TO/
# Сторінка — site/index.html; картинки беруться з docs/assets, щоб не тримати їх у репозиторії двічі.
# tools/build_site.py збирає з неї index.html (українська) і en.html з текстом у HTML для пошуковиків.
# Увімкнути один раз: Settings → Pages → Source: GitHub Actions (tools/publish_github.ps1 робить це сам).
name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/assets/**", "tools/build_site.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -r docs/assets _site/assets
          # окрема сторінка з готовим текстом для кожної мови, canonical/hreflang, schema.org і sitemap.xml
          python3 tools/build_site.py site _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
