# OptimaX — перевірка на кожен push і pull request (і як частина релізу, див. release.yml).
#   linux          — тести логіки, вікно на справжньому PyQt6 (offscreen), сцена тесту GPU на Mesa OpenGL,
#                    фальшива Windows для перевірки відкату й OptimaX-Rescue.cmd
#   windows-tests  — ті самі тести на Windows + самоперевірка з вихідних файлів на справжньому залізі (лише читання)
#   windows-tweaks — НА СПРАВЖНІЙ Windows: кожен твік застосувати → перевірити → відкотити → перевірити;
#                    потім пакетом з відкатом через OptimaX-Rescue.cmd /all і через журнал програми
#   windows-build  — інсталятор і портативна версія, самоперевірка зібраних exe, тихе встановлення й видалення
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      quick:
        description: "Лише збірка exe з самоперевіркою й встановленням (для швидкого релізу)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') }}

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHON_VERSION: "3.12"

jobs:
  linux:
    name: Linux · logic, UI, OpenGL, fake Windows
    if: ${{ !inputs.quick }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: System libraries (Qt offscreen, Mesa OpenGL without a screen)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libegl1 libgl1 libegl-mesa0 libgl1-mesa-dri \
            libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-dejavu-core
      - name: Python packages
        run: python -m pip install -r requirements.txt pytest cryptography
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
          OPTIMAX_TEST_SHOTS: ${{ runner.temp }}/shots
        run: python -m pytest tests -v -rs --tb=short --junitxml="${{ runner.temp }}/junit-linux.xml"
      - name: Why it failed
        if: failure()
        run: python tests/ci_annotate.py junit "${{ runner.temp }}/junit-linux.xml"
      - name: Summary
        if: always()
        run: |
          for f in "${{ runner.temp }}"/shots/*.md; do [ -f "$f" ] && cat "$f" >> "$GITHUB_STEP_SUMMARY"; done; true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-tests
          path: |
            ${{ runner.temp }}/shots
            ${{ runner.temp }}/junit-linux.xml
          if-no-files-found: ignore

  windows-tests:
    name: Windows ${{ matrix.os }} · tests, self-test from source
    if: ${{ !inputs.quick }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Python packages
        run: python -m pip install -r requirements.txt pytest cryptography
      - name: Tests (preview mode only — nothing on this machine is changed here)
        env:
          OPTIMAX_TEST_SHOTS: ${{ runner.temp }}\shots
        run: python -m pytest tests -v -rs --tb=short --junitxml="${{ runner.temp }}\junit-${{ matrix.os }}.xml"
      - name: Why it failed
        if: failure()
        run: python tests/ci_annotate.py junit "${{ runner.temp }}\junit-${{ matrix.os }}.xml"
      - name: Summary
        if: always()
        shell: pwsh
        run: Get-ChildItem "${{ runner.temp }}\shots\*.md" -ErrorAction SilentlyContinue | Get-Content | Add-Content $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-tests-${{ matrix.os }}
          path: |
            ${{ runner.temp }}\shots
            ${{ runner.temp }}\junit-${{ matrix.os }}.xml
          if-no-files-found: ignore

  windows-tweaks:
    name: Windows ${{ matrix.os }} · tweak round-trip (real system)
    if: ${{ !inputs.quick }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Apply → verify → undo → verify every tweak, then batches via OptimaX-Rescue.cmd and the journal
        run: python tests/windows/tweak_roundtrip.py --out "${{ runner.temp }}\roundtrip" --budget-min 150
      - name: Why it failed
        if: failure()
        run: python tests/ci_annotate.py roundtrip "${{ runner.temp }}\roundtrip\roundtrip.json"
      - name: Summary
        if: always()
        shell: pwsh
        run: Get-Content "${{ runner.temp }}\roundtrip\roundtrip.md" -ErrorAction SilentlyContinue | Add-Content $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: roundtrip-${{ matrix.os }}
          path: ${{ runner.temp }}\roundtrip
          if-no-files-found: ignore

  windows-build:
    name: Windows · installer + portable, self-test, install/uninstall
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      OPTIMAX_UPDATE_REPO: ${{ github.repository }}  # зібрана програма шукатиме оновлення в релізах цього репозиторію
      PFX_B64: ${{ secrets.OPTIMAX_PFX_BASE64 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Inno Setup
        shell: pwsh
        run: |
          $found = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
                     "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe", "$env:ProgramFiles\Inno Setup 7\ISCC.exe") |
                   Where-Object { Test-Path $_ }
          if (-not $found) { choco install innosetup -y --no-progress; if ($LASTEXITCODE) { exit $LASTEXITCODE } }
      - name: Code signing certificate (only when the OPTIMAX_PFX_BASE64 secret is set)
        if: env.PFX_B64 != ''
        shell: pwsh
        env:
          PFX_PASS: ${{ secrets.OPTIMAX_PFX_PASS }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "optimax.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64))
          "OPTIMAX_PFX=$pfx" | Add-Content $env:GITHUB_ENV
          "OPTIMAX_PFX_PASS=$env:PFX_PASS" | Add-Content $env:GITHUB_ENV
      - name: Build the installer
        shell: cmd
        run: call build_installer.bat
      - name: Build the portable version
        shell: cmd
        run: call build.bat
      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = python packaging/release.py version
          "v=$v" | Add-Content $env:GITHUB_OUTPUT
      - name: Mesa for mining cards (OpenGL on the card through DirectX 12)
        id: mesa
        continue-on-error: true  # сторонній реліз недоступний — програма без Mesa однаково збирається
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPTIMAX_MESA_TAG: "26.2.0"  # закріплена версія: зміни в mesa-dist-win не мають ламати релізи OptimaX
        run: |
          $zip = python packaging/release.py mesa Output | Select-Object -Last 1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "zip=$zip" | Add-Content $env:GITHUB_OUTPUT
          "**Mesa**: $(Split-Path $zip -Leaf), $([math]::Round((Get-Item $zip).Length / 1MB, 1)) MB" | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: GPU test through Mesa (the runner has no GPU — Mesa d3d12 on WARP)
        if: ${{ steps.mesa.outcome == 'success' }}
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "mesa"
          Expand-Archive -Force "${{ steps.mesa.outputs.zip }}" $dir
          $out = Join-Path $env:RUNNER_TEMP "gpubench-mesa.json"
          $env:OPTIMAX_BENCH_FAST = "1"
          $env:MESA_D3D12_DEFAULT_ADAPTER_NAME = "Microsoft Basic Render"
          $exe = "Output\OptimaX-${{ steps.ver.outputs.v }}-portable.exe"
          $a = @("--gpu-bench", "--preset=ab", "--mode=bench", "--quality=ab", "--seconds=3", "--mesa=`"$dir`"", "--out=`"$out`"")
          $p = Start-Process $exe -ArgumentList $a -Wait -PassThru
          $r = Get-Content $out -Raw -ErrorAction SilentlyContinue | ConvertFrom-Json
          "**GPU test via Mesa**: exit $($p.ExitCode), state $($r.state), renderer $($r.renderer), GL $($r.gl), mesa $($r.mesa), frames $($r.frames)" | Add-Content $env:GITHUB_STEP_SUMMARY
          if (-not $r -or $r.state -ne "done" -or -not $r.mesa -or "$($r.renderer)" -notmatch "D3D12") {
            Write-Output "::error::The GPU test did not render through Mesa d3d12: $($r | ConvertTo-Json -Compress -Depth 4)"
            exit 1
          }
      - name: Self-test of the portable exe (without a window, off-screen window, real window)
        id: portable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force reports | Out-Null
          $exe = "Output\OptimaX-${{ steps.ver.outputs.v }}-portable.exe"
          $modes = [ordered]@{ "core" = @(); "ui-offscreen" = @("--selftest-ui", "--selftest-platform=offscreen"); "ui-windows" = @("--selftest-ui") }
          $fail = 0
          foreach ($m in $modes.Keys) {
            $rep = Join-Path $PWD "reports\selftest-portable-$m.json"
            $p = Start-Process $exe -ArgumentList (@("--selftest=`"$rep`"") + $modes[$m]) -Wait -PassThru
            "**portable $m**: exit code $($p.ExitCode)" | Add-Content $env:GITHUB_STEP_SUMMARY
            Get-Content ($rep -replace '\.json$', '.md') -ErrorAction SilentlyContinue | Add-Content $env:GITHUB_STEP_SUMMARY
            if ($p.ExitCode -ne 0) { $fail = 1; python tests/ci_annotate.py selftest $rep $p.ExitCode "portable $m" }
          }
          exit $fail
      - name: Install → self-test → rescue launcher → uninstall
        if: ${{ !cancelled() && steps.ver.outcome == 'success' }}
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/windows/smoke_install.ps1 -Setup "Output\OptimaX-Setup-${{ steps.ver.outputs.v }}.exe" -Out reports -Version "${{ steps.ver.outputs.v }}"
          $code = $LASTEXITCODE
          Get-Content reports\smoke.md -ErrorAction SilentlyContinue | Add-Content $env:GITHUB_STEP_SUMMARY
          Get-Content reports\selftest-installed.md -ErrorAction SilentlyContinue | Add-Content $env:GITHUB_STEP_SUMMARY
          if ($code -ne 0) {
            python tests/ci_annotate.py smoke reports\smoke.json
            python tests/ci_annotate.py selftest reports\selftest-installed.json
          }
          exit $code
      - name: Checksums
        shell: pwsh
        run: |
          $files = @("Output/OptimaX-Setup-${{ steps.ver.outputs.v }}.exe", "Output/OptimaX-${{ steps.ver.outputs.v }}-portable.exe")
          $files += @(Get-ChildItem Output/OptimaX-Mesa-*.zip -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName })
          python packaging/release.py checksums @files
      - uses: actions/upload-artifact@v7
        with:
          name: optimax-build
          path: |
            Output/OptimaX-Setup-*.exe
            Output/OptimaX-*-portable.exe
            Output/OptimaX-Rescue.cmd
            Output/OptimaX-Mesa-*.zip
            Output/SHA256SUMS.txt
            Output/winget
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: build-reports
          path: reports
          if-no-files-found: ignore
