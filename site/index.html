<style>
@font-face {
  font-family: "Geologica";
  src: url("fonts/Geologica.woff") format("woff");
  font-weight: 100 900;
  font-display: swap;
}
:root {
  --night: #0A0C11; --panel: #12161E; --panel2: #181D27; --line: #202734; --line2: #2A3242;
  --text: #ECEFF4; --sub: #9AA3B5; --mute: #646D80;
  --blue: #5B8CFF; --blue-h: #7AA2FF; --violet: #9B6BFF; --green: #3DD68C; --red: #FF5D6C;
  --radius-s: 8px; --radius-l: 18px;
  --gutter: clamp(16px, 4vw, 48px);
  --max: 1200px;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--night); color: var(--text);
  font-family: "Geologica", "Segoe UI", system-ui, sans-serif; font-size: 17px; line-height: 1.55;
  font-variation-settings: "SHRP" 0; -webkit-font-smoothing: antialiased;
}
a { color: var(--blue-h); text-decoration-thickness: 1px; text-underline-offset: 3px; }
a:hover { color: var(--text); }
:focus-visible { outline: 2px solid var(--blue-h); outline-offset: 3px; border-radius: 4px; }
img { max-width: 100%; display: block; }
.wrap { max-width: var(--max); margin: 0 auto; padding: 0 var(--gutter); }

/* шапка */
header { position: sticky; top: 0; z-index: 10; background: rgba(10, 12, 17, .86); backdrop-filter: blur(10px);
         border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; gap: 28px; height: 64px; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--text); text-decoration: none; margin-right: auto; }
.brand img { width: 30px; height: 30px; }
.brand b { font-size: 20px; font-weight: 720; letter-spacing: -0.02em; font-variation-settings: "SHRP" 100; }
nav.links { display: flex; gap: 22px; font-size: 15px; }
nav.links a { color: var(--sub); text-decoration: none; }
nav.links a:hover { color: var(--text); }
.lang { display: flex; border: 1px solid var(--line2); border-radius: 999px; padding: 2px; }
.lang button { font: inherit; font-size: 13px; color: var(--sub); background: none; border: 0; padding: 4px 10px;
               border-radius: 999px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--panel2); color: var(--text); }
.gh { color: var(--sub); display: flex; }
.gh:hover { color: var(--text); }

/* перший екран */
.hero { padding: clamp(48px, 9vw, 112px) 0 clamp(40px, 6vw, 72px); }
.hero .wrap { display: grid; grid-template-columns: minmax(0, 6fr) minmax(0, 6fr); gap: clamp(24px, 4vw, 56px);
              align-items: center; }
h1 { margin: 0; font-size: clamp(36px, 4.7vw, 62px); line-height: 1.02; letter-spacing: -0.035em; font-weight: 700;
     font-variation-settings: "SHRP" 100; text-wrap: balance; }
.lead { margin: 22px 0 0; font-size: clamp(17px, 1.5vw, 19px); color: var(--sub); max-width: 34em; }
.cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }
.btn { display: inline-flex; flex-direction: column; justify-content: center; min-height: 54px; padding: 8px 22px;
       border-radius: var(--radius-s); text-decoration: none; font-weight: 600; line-height: 1.2; }
.btn small { font-weight: 400; font-size: 13px; opacity: .8; margin-top: 3px; }
.btn.primary { background: linear-gradient(100deg, var(--blue), var(--violet)); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); color: #fff; }
.btn.quiet { border: 1px solid var(--line2); color: var(--text); }
.btn.quiet:hover { background: var(--panel); }
.req { margin-top: 18px; font-size: 14px; color: var(--mute); }
.trace { width: 100%; height: auto; overflow: visible; }
.trace .t-axis { font-size: 12px; fill: var(--mute); }
.trace .t-tag { font-size: 14px; fill: var(--mute); }
.trace .t-tag.after { fill: var(--sub); }
.trace .after-line { stroke-dasharray: var(--len); stroke-dashoffset: 0; }
@media (prefers-reduced-motion: no-preference) {
  .trace.play .after-line { animation: draw 1.6s cubic-bezier(.5, 0, .2, 1) .5s both; }
  .trace.play .after-fill { animation: fade 1s ease .9s both; }
}
@keyframes draw { from { stroke-dashoffset: var(--len); } to { stroke-dashoffset: 0; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

/* розділи */
section { padding: clamp(56px, 8vw, 104px) 0; border-top: 1px solid var(--line); }
h2 { margin: 0 0 14px; font-size: clamp(28px, 3.4vw, 42px); line-height: 1.1; letter-spacing: -0.025em;
     font-weight: 680; font-variation-settings: "SHRP" 80; text-wrap: balance; }
.intro { color: var(--sub); max-width: 40em; margin: 0 0 36px; }

/* інтерфейс */
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
.tabs button { font: inherit; font-size: 15px; color: var(--sub); background: none; border: 1px solid var(--line2);
               padding: 8px 14px; border-radius: 999px; cursor: pointer; }
.tabs button:hover { color: var(--text); }
.tabs button[aria-selected="true"] { color: var(--text); background: var(--panel2); border-color: var(--blue); }
.shot { border-radius: var(--radius-l); overflow: hidden; border: 1px solid var(--line2); background: var(--panel); }
.shot img { width: 100%; height: auto; aspect-ratio: 1920 / 1260; object-fit: cover; object-position: top; }
.caption { color: var(--sub); margin: 14px 0 0; font-size: 15px; min-height: 2.6em; }

/* кроки */
ol.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
           gap: 0; counter-reset: s; }
ol.steps li { counter-increment: s; padding: 0 22px 0 0; position: relative; }
ol.steps li::before { content: counter(s); display: grid; place-items: center; width: 34px; height: 34px;
                      border-radius: 50%; border: 1px solid var(--green); color: var(--green); font-size: 15px;
                      margin-bottom: 16px; background: var(--night); position: relative; z-index: 1; }
ol.steps li::after { content: ""; position: absolute; left: 34px; right: 0; top: 17px; height: 1px; background: var(--line2); }
ol.steps li:last-child::after { display: none; }
ol.steps b { display: block; font-size: 18px; margin-bottom: 6px; }
ol.steps span { color: var(--sub); font-size: 15px; }

/* безпека */
.safe { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: clamp(24px, 5vw, 72px); }
.safe ul { list-style: none; margin: 0; padding: 0; }
.safe li { padding: 16px 0 16px 34px; border-bottom: 1px solid var(--line); position: relative; }
.safe li:first-child { padding-top: 0; }
.safe li:first-child::before { top: 4px; }
.safe li::before { content: ""; position: absolute; left: 2px; top: 20px; width: 14px; height: 8px;
                   border-left: 2px solid var(--green); border-bottom: 2px solid var(--green); transform: rotate(-45deg); }
.safe li b { display: block; }
.safe li span { color: var(--sub); font-size: 15px; }
.cmd { display: inline-block; margin-top: 20px; font-family: Consolas, "Cascadia Mono", monospace; font-size: 14px;
       background: var(--panel); border: 1px solid var(--line2); border-radius: var(--radius-s); padding: 10px 14px;
       color: var(--sub); }

/* можливості */
.groups { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(24px, 4vw, 56px); }
.groups h3 { margin: 0 0 14px; font-size: 20px; font-weight: 650; }
.groups dl { margin: 0; }
.groups dt { font-weight: 600; margin-top: 16px; }
.groups dd { margin: 4px 0 0; color: var(--sub); font-size: 15px; }

/* питання */
#faq-list { max-width: 820px; }
details { border-bottom: 1px solid var(--line); }
summary { cursor: pointer; padding: 18px 0; font-weight: 600; list-style: none; display: flex; gap: 16px;
          justify-content: space-between; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "+"; color: var(--mute); font-weight: 400; font-size: 22px; line-height: 1; }
details[open] summary::after { content: "−"; }
details p { margin: 0 0 18px; color: var(--sub); }

footer { border-top: 1px solid var(--line); padding: 36px 0 48px; color: var(--mute); font-size: 14px; }
footer .wrap { display: flex; flex-wrap: wrap; gap: 12px 28px; align-items: center; }
footer nav { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-left: auto; }
footer a { color: var(--sub); text-decoration: none; }
footer a:hover { color: var(--text); }

@media (max-width: 600px) {
  .trace .t-axis { font-size: 21px; }
  .trace .t-tag { font-size: 24px; }
}
@media (max-width: 960px) {
  .hero .wrap, .safe { grid-template-columns: 1fr; }
  ol.steps { grid-template-columns: 1fr; gap: 22px; }
  ol.steps li { padding: 0 0 0 52px; }
  ol.steps li::before { position: absolute; left: 0; top: 0; margin: 0; }
  ol.steps li::after { display: none; }
  .groups { grid-template-columns: 1fr; }
  nav.links { display: none; }
}
</style>

const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* немає сховища — не страшно */ } },
};
let lang = store.get("optimax-lang") || ((navigator.language || "").toLowerCase().startsWith("uk") ? "uk" : "en");
let tab = 0;
let release = null;

function fmt(s, kw) { return s.replace(/\{(\w+)\}/g, (_, k) => kw[k]); }

function drawTrace() {
  const t = T[lang], svg = document.getElementById("trace");
  const W = 700, H = 380, x0 = 8, x1 = 692, split = x0 + (x1 - x0) * 0.44, top = 46, bot = 352;
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const y = ms => bot - (ms / 26) * (bot - top);
  const pts = [];
  for (let i = 0; i <= 120; i++) {
    const x = x0 + (x1 - x0) * i / 120;
    let ms;
    if (x < split) {
      ms = 13.2 + (rnd() - 0.5) * 3.4;
      if (rnd() < 0.09 && x < split - 30) ms += 6 + rnd() * 7.5;
    } else {
      const k = Math.min(1, (x - split) / 26), a = 13.2 + (rnd() - 0.5) * 3.4, b = 7.4 + (rnd() - 0.5) * 0.9;
      ms = a * (1 - k) + b * k;
    }
    pts.push([x, y(ms)]);
  }
  const P = arr => arr.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const iS = pts.findIndex(p => p[0] >= split), after = pts.slice(iS - 1), before = pts.slice(0, iS);
  let s = `<title id="trace-title">${t.trace_title}</title><defs>
    <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#5B8CFF"/><stop offset="1" stop-color="#9B6BFF"/></linearGradient>
    <linearGradient id="fill" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#5B8CFF" stop-opacity=".18"/><stop offset="1" stop-color="#5B8CFF" stop-opacity="0"/></linearGradient></defs>`;
  for (const [ms, label] of [[16.7, t.ms60], [8.33, t.ms120]]) {
    s += `<line x1="${x0}" x2="${x1}" y1="${y(ms)}" y2="${y(ms)}" stroke="#202734" stroke-dasharray="2 6"/>`;
    s += `<text class="t-axis" x="${x1}" y="${y(ms) - 8}" text-anchor="end">${label}</text>`;
  }
  s += `<path class="after-fill" d="${P(after)} L${x1} ${bot} L${after[0][0]} ${bot} Z" fill="url(#fill)"/>`;
  s += `<path d="${P(before)}" fill="none" stroke="#646D80" stroke-width="2" stroke-linejoin="round"/>`;
  for (let i = 1; i < before.length; i++) {
    if (bot - before[i][1] > (bot - top) * 0.62) {
      const n = before[i + 1] || pts[iS];
      s += `<path d="M${before[i - 1][0].toFixed(1)} ${before[i - 1][1].toFixed(1)} L${before[i][0].toFixed(1)} ${before[i][1].toFixed(1)} L${n[0].toFixed(1)} ${n[1].toFixed(1)}" fill="none" stroke="#FF5D6C" stroke-width="2.4" stroke-linejoin="round"/>`;
    }
  }
  s += `<path class="after-line" d="${P(after)}" fill="none" stroke="url(#g)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
  s += `<line x1="${split}" x2="${split}" y1="${top - 22}" y2="${bot}" stroke="#2A3242" stroke-width="1.5"/>`;
  s += `<text class="t-tag" x="${split - 12}" y="${top - 8}" text-anchor="end">${t.before}</text>`;
  s += `<text class="t-tag after" x="${split + 12}" y="${top - 8}">${t.after}</text>`;
  svg.innerHTML = s;
  const line = svg.querySelector(".after-line");
  line.style.setProperty("--len", Math.ceil(line.getTotalLength()));
}

function renderTabs() {
  const t = T[lang], box = document.getElementById("tabs");
  box.innerHTML = "";
  t.tabs.forEach(([id, name], i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.setAttribute("role", "tab");
    b.id = "tab-" + id;
    b.textContent = name;
    b.setAttribute("aria-selected", i === tab ? "true" : "false");
    b.setAttribute("aria-controls", "shot-panel");
    b.tabIndex = i === tab ? 0 : -1;
    b.addEventListener("click", () => { tab = i; renderTabs(); showShot(); });
    b.addEventListener("keydown", e => {
      if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
      tab = (tab + (e.key === "ArrowRight" ? 1 : t.tabs.length - 1)) % t.tabs.length;
      renderTabs(); showShot(); document.getElementById("tab-" + t.tabs[tab][0]).focus();
    });
    box.appendChild(b);
  });
}

function showShot() {
  const [id, name, cap] = T[lang].tabs[tab];
  const img = document.getElementById("shot");
  img.src = `assets/screens/${lang}/${id}.png`;
  img.alt = `${name}: ${cap}`;
  document.getElementById("shot-panel").setAttribute("aria-labelledby", "tab-" + id);
  document.getElementById("caption").textContent = cap;
}

function renderLists() {
  const t = T[lang];
  for (const g of ["fg1", "fg2", "fg3"]) document.getElementById(g).innerHTML = "";
  for (const [g, title, d] of t.f) {
    const dt = document.createElement("dt"), dd = document.createElement("dd");
    dt.textContent = title; dd.textContent = d;
    document.getElementById(g).append(dt, dd);
  }
  const faq = document.getElementById("faq-list");
  faq.innerHTML = "";
  for (const [q, a] of t.q) {
    const d = document.createElement("details"), s = document.createElement("summary"), p = document.createElement("p");
    s.textContent = q; p.textContent = a;
    d.append(s, p); faq.appendChild(d);
  }
}

function renderRelease() {
  if (!release) return;
  const t = T[lang], mb = a => Math.round(a.size / 1048576);
  const setup = release.assets.find(a => /^OptimaX-Setup-[\d.]+\.exe$/i.test(a.name));
  const port = release.assets.find(a => /^OptimaX-[\d.]+-portable\.exe$/i.test(a.name));
  const v = (release.tag_name || "").replace(/^v/i, "");
  if (setup) {
    document.getElementById("dl-setup").href = setup.browser_download_url;
    document.getElementById("dl-setup-meta").textContent = fmt(t.version, { v, mb: mb(setup) });
  }
  if (port) {
    document.getElementById("dl-portable").href = port.browser_download_url;
    document.getElementById("dl-portable-meta").textContent = fmt(t.portable_meta, { mb: mb(port) });
  }
}

function apply(l) {
  lang = l;
  document.documentElement.lang = l;
  const t = T[l];
  document.querySelectorAll("[data-t]").forEach(el => { if (typeof t[el.dataset.t] === "string") el.textContent = t[el.dataset.t]; });
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === l ? "true" : "false"));
  document.getElementById("f-docs").href = `https://github.com/${REPO}/blob/main/${t.docs}`;
  drawTrace(); renderTabs(); showShot(); renderLists(); renderRelease();
}

document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => { store.set("optimax-lang", b.dataset.lang); apply(b.dataset.lang); }));
apply(lang);
requestAnimationFrame(() => document.getElementById("trace").classList.add("play"));

fetch(`https://api.github.com/repos/${REPO}/releases/latest`, { headers: { Accept: "application/vnd.github+json" } })
  .then(r => (r.ok ? r.json() : null))
  .then(rel => { if (rel && Array.isArray(rel.assets)) { release = rel; renderRelease(); } })
  .catch(() => { /* без мережі кнопки ведуть на сторінку релізів */ });
})();
</script>
